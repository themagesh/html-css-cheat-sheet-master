<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="author" content="acchou" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->

      property="og:title"

      name="twitter:title"
      content="HTML &amp; CSS Cheat Sheet — Web Development Reference"

      name="twitter:description"
      content="A curated visual cheat sheet for HTML5 and CSS with live examples and tools for front-end developers."
